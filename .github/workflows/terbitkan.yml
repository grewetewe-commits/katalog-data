name: Terbitkan data (manual)

# Menerbitkan ulang isi cabang `data` repo dapur ke repo publik tanpa menunggu putaran otak.
# Juga jalan otomatis saat terbitkan.sh / workflow terbit diubah di main (secret TOKEN_DAPUR diperbarui 2026-10-18).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - terbitkan.sh
      - .github/workflows/terbit-inti.yml
      - .github/workflows/terbitkan.yml

permissions:
  contents: write

jobs:
  terbit:
    uses: ./.github/workflows/terbit-inti.yml
    secrets: inherit
